<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace starter</title><style>body{font:18px system-ui;margin:10vh auto;padding:24px;max-width:700px;background:#111827;color:#f9fafb}button{font:inherit;padding:12px;border:0;border-radius:8px;background:#a5b4fc}output{display:block;margin-top:24px}</style><h1>Your web workspace is ready</h1><p>Edit this app in <code>projects/web-starter</code>, then refresh the port preview.</p><button id="check">Check backend</button><output id="result"></output><script>document.querySelector('#check').onclick=async()=>{try{const r=await fetch('api/health');if(!r.ok)throw Error(r.status);document.querySelector('#result').textContent=JSON.stringify(await r.json())}catch(e){document.querySelector('#result').textContent='Request failed: '+e.message}};</script></html>
