# Internal Open WebUI stack (Open WebUI only; no Ollama).
# Run from the repository root:
#   docker compose --env-file Michael/.env -f Michael/docker-compose.yaml up --build -d
# Project name is fixed to "michael" so it never collides with the upstream stack.
name: ${COMPOSE_PROJECT_NAME:-michael}

services:
  open-webui:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    env_file:
      - .env
    environment:
      ENABLE_OLLAMA_API: "false"
      # Accounts are created only by an admin. The first account on a fresh volume is still allowed (Open WebUI lets
      # the first sign-up through and makes it the admin). Saved settings override these, so bootstrap/accounts.py
      # (run by provision.py) also saves them.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-user}
      # Encrypt tool valves (the translator API key) at rest. Needs a stable WEBUI_SECRET_KEY. It reaches the container
      # through env_file (.env); provision.py --init-env generates it there when missing.
      ENABLE_VALVE_ENCRYPTION: ${ENABLE_VALVE_ENCRYPTION:-true}
      # Fallback for the in-container CA path; .env may override it.
      AIOHTTP_CLIENT_SSL_CERT_FILE: ${AIOHTTP_CLIENT_SSL_CERT_FILE:-/certs/ca-bundle.pem}
      # Web search through the Perplexity Search API (engine perplexity_search; the older "perplexity" engine uses a chat endpoint Perplexity has retired); the key (PERPLEXITY_API_KEY) comes from .env. Open WebUI keeps
      # saved settings in its database, so on an existing volume bootstrap/presets.py also pushes them.
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-perplexity_search}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    volumes:
      - open-webui:/app/backend/data
      - ./runtime/certs:/certs:ro
    ports:
      - ${OPEN_WEBUI_PORT:-3000}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # Employee directory (REST API, UI and MCP server), built from its own source tree.
  # Open WebUI reaches the MCP endpoint at http://employee-directory:8000/mcp over the
  # default network of this project. SECURITY: the UI and REST API have no sign-in, so
  # the port is published on loopback only. The real data lives in a named volume;
  # seed it at run time with bootstrap/seed_employees.py (never bake data into the image).
  employee-directory:
    build:
      # A checkout (or symlink) of the employee-directory repository. Set in .env.
      context: ${EMPLOYEE_DIRECTORY_SRC:-./services/employee-directory}
    image: ${EMPLOYEE_DIRECTORY_IMAGE:-michael-employee-directory:local}
    environment:
      EMPLOYEE_ADMIN_TOKEN: ${EMPLOYEE_ADMIN_TOKEN:-}              # unset = permanent delete and import disabled
      EMPLOYEE_MCP_WRITE_TOOLS: ${EMPLOYEE_MCP_WRITE_TOOLS:-}      # empty = read-only MCP; e.g. create,update,delete
      EMPLOYEE_MCP_API_KEY: ${EMPLOYEE_MCP_API_KEY:-}              # optional bearer key for /mcp
    ports:
      - 127.0.0.1:${EMPLOYEE_DIRECTORY_PORT:-8780}:8000
    volumes:
      - employee-directory-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Optional write instance: the same image and data volume with the MCP write tools on, behind
  # its own bearer key, no published port. Start it with `--profile write`; register it with
  # the (disabled by default) employee_directory_write entry of mcp/mcp.json.
  employee-directory-write:
    profiles: [write]
    image: ${EMPLOYEE_DIRECTORY_IMAGE:-michael-employee-directory:local}
    depends_on:
      employee-directory:
        condition: service_healthy
    environment:
      EMPLOYEE_MCP_WRITE_TOOLS: ${EMPLOYEE_WRITE_MCP_TOOLS:-create,update,delete}
      EMPLOYEE_MCP_API_KEY: ${EMPLOYEE_WRITE_MCP_API_KEY:-}
      EMPLOYEE_AUTO_MIGRATE: "false"                               # the read instance migrates the shared database
    command:
      - sh
      - -c
      - '[ -n "$$EMPLOYEE_MCP_API_KEY" ] || { echo "EMPLOYEE_WRITE_MCP_API_KEY is required" >&2; exit 1; }; exec python -m employee_directory serve'
    volumes:
      - employee-directory-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Mail service: draft-only MCP for the model (no send tool) and a REST API that only the signed-in
  # user's own Open WebUI session can use to send. Built from its own source tree. Open WebUI reaches
  # the MCP endpoint at http://mail-service:8000/mcp, and the "Review and send email" action calls
  # the REST API from inside Open WebUI, so no port is published. It validates user sessions against
  # Open WebUI over this project's network. The sender is the user's own company address, otherwise
  # the shared sender; there is no redirect switch (MAIL_REDIRECT_ALL=off). SMTP settings come from
  # .env (SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_USE_TLS) and are never committed.
  # MAIL_PROVIDER=mock (the default) records messages in the data volume and sends nothing.
  mail-service:
    build:
      # A checkout of the mail-service repository. Set in .env.
      context: ${MAIL_SERVICE_SRC:-./services/mail-service}
    image: ${MAIL_SERVICE_IMAGE:-michael-mail-service:local}
    environment:
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}                         # mock | smtp
      MAIL_MCP_API_KEY: ${MAIL_MCP_API_KEY:-}                       # unset = /mcp refuses everything
      OWUI_URL: http://open-webui:8080
      MAIL_SHARED_SENDER: ${MAIL_SHARED_SENDER:-lenny@lenovo.com}
      MAIL_ALLOWED_DOMAINS: ${MAIL_ALLOWED_DOMAINS:-lenovo.com}
      MAIL_ALLOW_EXTERNAL_OWNERS: ${MAIL_ALLOW_EXTERNAL_OWNERS:-true}  # users without a company address send as the shared sender
      MAIL_REDIRECT_ALL: "off"
      MAIL_MAX_ATTACHMENTS: ${MAIL_MAX_ATTACHMENTS:-5}
      MAIL_MAX_ATTACHMENT_BYTES: ${MAIL_MAX_ATTACHMENT_BYTES:-10485760}
      MAIL_MAX_TOTAL_ATTACHMENT_BYTES: ${MAIL_MAX_TOTAL_ATTACHMENT_BYTES:-20971520}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_SMTP_CA_FILE: ${MAIL_SMTP_CA_FILE:-}                     # in-container path, e.g. /certs/ca-bundle.pem
      # false keeps STARTTLS but does not verify the relay's certificate or host name (for a relay whose
      # certificate cannot be verified); the service logs a warning. See .env.example for the risk.
      MAIL_SMTP_TLS_VERIFY: ${MAIL_SMTP_TLS_VERIFY:-true}
    volumes:
      - mail-service-data:/data
      - ./runtime/certs:/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # Read-only derived case index; no source database or browser profile in this service.
  # One UID owns both the private 0600 index and reader. No published host port.
  qdts-cases:
    build:
      context: ${QDTS_CASES_SRC:-./services/devqdts}
      dockerfile: Dockerfile.cases
    image: ${QDTS_CASES_IMAGE:-michael-qdts-cases:local}
    user: "10001:10001"
    environment:
      QDTS_API_KEY: ${QDTS_MCP_API_KEY:-}
      QDTS_INDEX: /data/qdts_index.db
      QDTS_ALLOWED_HOSTS: qdts-cases:8000,localhost:8000,127.0.0.1:8000
    volumes:
      - qdts-cases-data:/data:ro
    restart: unless-stopped

  # Run explicitly after an approved sync/backup, never on WebUI startup.
  # Root only prepares the volume ownership; the index build itself runs as uid 10001.
  qdts-indexer:
    profiles: [index]
    build:
      context: ${QDTS_CASES_SRC:-./services/devqdts}
      dockerfile: Dockerfile.cases
    image: ${QDTS_CASES_IMAGE:-michael-qdts-cases:local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'chown 10001:10001 /data && exec su -s /bin/sh qdts -c "python -m qdts_cases.index --src /source/devqdts.db --out /data/qdts_index.db"'
    volumes:
      - qdts-cases-data:/data
      - type: bind
        source: ${QDTS_DEVQDTS_DATA:?Set QDTS_DEVQDTS_DATA to an approved normalized source folder}
        target: /source
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

# Reuse the data volume of the original stack so existing chats carry over.
volumes:
  qdts-cases-data:
  employee-directory-data:
  mail-service-data:
  open-webui:
    external: true
    name: ${OPEN_WEBUI_VOLUME:-open-webui_open-webui}
